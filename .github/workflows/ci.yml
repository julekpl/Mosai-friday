# MOSAI CI (pack T1.5). One job per concern so a red build names its cause.
#
# Jobs: install · codegen · typecheck · lint · unit · security-history ·
#        security · e2e · a11y.
# `bun` is authoritative (T1.1). Do not reintroduce `npm ci`.
#
# One gate is staged honestly rather than faked:
#   - codegen (T1.2) needs a Convex deployment key to regenerate the bindings;
#     until the owner adds it the job warns and skips (dated TODO below).
# The dependency audit (T1.6) is now a hard failure: `bun audit` reports no
# vulnerabilities at any level.
#
# BP-01 (23 Sep 2026):
#   - The full-history secret scan now runs in its OWN job
#     (`security-history`). Previously it was the first step of `security`,
#     so when it found a historical credential it *skipped* the working-tree
#     scan, the local scan, both authorization audits and the dependency
#     audit — real checks hidden behind one red step. Both jobs always
#     execute; a history finding no longer hides the others.
#   - Browser jobs no longer treat `https://placeholder.convex.cloud` as a
#     working service: the URL below is inert, every Convex call is
#     intercepted by the documented test-only backend double
#     (tests/e2e/fixtures/test-backend.ts), and the real OTP journey is a
#     separate opt-in spec (tests/e2e/otp-live.spec.ts).
#   - On failure the browser jobs upload their traces/screenshots
#     (test-results/) as artifacts named with the exact commit SHA, kept for
#     7 days. They contain only synthetic test data (test-only double, no
#     credentials, example.com addresses), so they are sanitized by
#     construction.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned tooling. Bump deliberately, in the same PR as the lockfile change.
  BUN_VERSION: "1.3.14"
  GITLEAKS_VERSION: "8.28.0"

jobs:
  install:
    name: install (frozen lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install from bun.lock
        run: bun install --frozen-lockfile
      - name: Fail on lockfile drift
        run: git diff --exit-code -- bun.lock

  codegen:
    name: codegen drift (Convex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check committed Convex bindings
        env:
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          # TODO(T1.5, 2026-09-22): the owner must add the CONVEX_DEPLOY_KEY
          # secret and CONVEX_DEPLOYMENT variable. `convex codegen` needs a
          # reachable deployment; a fresh-clone typecheck does not.
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::warning::CONVEX_DEPLOY_KEY is not set; skipping the codegen drift check. Add the secret to enable it."
            exit 0
          fi
          bun run check:codegen

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  unit:
    name: unit (convex-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  # BP-01: split out of `security` so a history finding can no longer skip
  # the working-tree scan and the audits. `--redact` keeps matched secrets out
  # of the log; the finding is the signal, never the value. A red here is the
  # honest state of the repository's history until the owner authorizes the
  # credential rotation + history purge (docs/runbooks/secret-rotation.md) —
  # never silence it with an allow-list entry.
  security-history:
    name: security (full-history secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scan — full history
        run: gitleaks detect --no-banner --config .gitleaks.toml --redact --exit-code 1

  security:
    name: security (working tree · functions · capabilities · audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Secret scan — working tree
        run: gitleaks detect --no-git --no-banner --config .gitleaks.toml --redact --exit-code 1

      # The same gate is available without gitleaks so `bun run check` is real
      # in any environment; it reads the rules from .gitleaks.toml.
      - name: Secret scan — local rules (bun run check path)
        run: bun run scan:secrets

      - name: Public-function authorization audit
        run: bun run audit:functions

      # T2.3: every module function must enforce a capability from
      # `src/convex/lib/capabilities.ts` (or be a documented exemption there).
      # Runs `bun scripts/audit-module-capabilities.mjs`, which imports the
      # registry, so it needs bun rather than plain node.
      - name: Module capability audit
        run: bun run audit:capabilities

      - name: Dependency audit (high and above)
        run: bun audit --audit-level=high

  e2e:
    name: e2e (Playwright journeys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run journeys
        env:
          # BP-01: inert URL — no service exists here and none is expected to
          # answer. Every Convex HTTP/WebSocket call is intercepted by the
          # test-only backend double before the network, so the tests are
          # hermetic instead of treating a placeholder as a working service.
          # The real OTP journey is tests/e2e/otp-live.spec.ts (opt-in,
          # needs E2E_LIVE_CONVEX_URL + E2E_LIVE_TEST_EMAIL).
          VITE_CONVEX_URL: https://e2e-test-only.convex.cloud
        run: bun run test:e2e
      - name: Upload browser traces/screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  a11y:
    name: a11y (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run axe gate
        env:
          # BP-01: same inert test-only URL as the e2e job (see above).
          VITE_CONVEX_URL: https://e2e-test-only.convex.cloud
        run: bun run test:a11y
      - name: Upload browser traces/screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
